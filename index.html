<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Hub - iOS Style</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .ios-card { background-color: #1c1c1e; border-radius: 16px; }
    .ios-blur { backdrop-filter: blur(20px); background: rgba(28, 28, 30, 0.85); }
    .page { display: none; }
    .page.active { display: block; }
  </style>
</head>
<body class="bg-black text-white min-h-screen pb-24 select-none">

  <!-- ================= PAGE 1: KATEGORIEN / SUCHEN ================= -->
  <div id="page-categories" class="page active">
    <div class="p-5 pt-8 max-w-lg mx-auto">
      <h1 class="text-3xl font-bold tracking-tight mb-4">Suchen</h1>
      
      <!-- Funktionsfähige Suchleiste -->
      <div class="bg-[#1c1c1e] text-gray-300 rounded-xl px-3 py-2 text-sm flex items-center gap-2 mb-6 border border-gray-800">
        <span>🔍</span>
        <input type="text" id="searchInput" onkeyup="filterCategories()" placeholder="Kategorien durchsuchen..." class="bg-transparent w-full focus:outline-none text-white placeholder-gray-500">
      </div>

      <!-- Kategorien Liste -->
      <div class="ios-card divide-y divide-gray-800/80 overflow-hidden" id="categoryList">
        
        <button onclick="openPage('page-activity')" class="cat-item w-full p-4 flex items-center justify-between hover:bg-gray-800/50 transition">
          <div class="flex items-center gap-3">
            <span class="text-xl">🔥</span>
            <span class="font-semibold text-base cat-name">Aktivität & Sport</span>
          </div>
          <span class="text-gray-500 font-bold">›</span>
        </button>

        <button onclick="openPage('page-learning')" class="cat-item w-full p-4 flex items-center justify-between hover:bg-gray-800/50 transition">
          <div class="flex items-center gap-3">
            <span class="text-xl">📚</span>
            <span class="font-semibold text-base cat-name">Lernen & Skills</span>
          </div>
          <span class="text-gray-500 font-bold">›</span>
        </button>

        <button onclick="openPage('page-finance')" class="cat-item w-full p-4 flex items-center justify-between hover:bg-gray-800/50 transition">
          <div class="flex items-center gap-3">
            <span class="text-xl">💼</span>
            <span class="font-semibold text-base cat-name">Finanzen & Deals</span>
          </div>
          <span class="text-gray-500 font-bold">›</span>
        </button>

        <button onclick="openPage('page-health')" class="cat-item w-full p-4 flex items-center justify-between hover:bg-gray-800/50 transition">
          <div class="flex items-center gap-3">
            <span class="text-xl">❤️</span>
            <span class="font-semibold text-base cat-name">Gesundheit & Schlaf</span>
          </div>
          <span class="text-gray-500 font-bold">›</span>
        </button>

      </div>
    </div>
  </div>

  <!-- ================= PAGE 2: AKTIVITÄT DETAIL ================= -->
  <div id="page-activity" class="page">
    <div class="p-5 pt-6 max-w-lg mx-auto">
      <button onclick="openPage('page-categories')" class="text-orange-500 font-semibold text-lg flex items-center gap-1 mb-4">
        ‹ Zurück
      </button>
      <h1 class="text-3xl font-bold tracking-tight mb-6">Aktivität</h1>

      <div class="space-y-4">
        <div class="ios-card p-4">
          <div class="text-orange-500 font-semibold text-xs mb-1">BEWEGUNG</div>
          <div class="text-2xl font-bold mb-2"><span id="calVal">0</span> <span class="text-base font-normal text-gray-400">kcal</span></div>
          <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden mb-3">
            <div id="calBar" class="bg-orange-500 h-full w-0 transition-all duration-300"></div>
          </div>
          <div class="flex gap-2">
            <button onclick="updateMetric('calVal', 50, 500, 'calBar')" class="bg-orange-500/20 text-orange-400 px-3 py-1.5 rounded-full text-xs font-semibold">+ 50 kcal</button>
            <button onclick="updateMetric('calVal', -50, 500, 'calBar')" class="bg-gray-800 text-gray-400 px-3 py-1.5 rounded-full text-xs font-semibold">- 50</button>
          </div>
        </div>

        <div class="ios-card p-4">
          <div class="text-orange-500 font-semibold text-xs mb-1">TRAINING</div>
          <div class="text-2xl font-bold mb-2"><span id="trainVal">0</span> <span class="text-base font-normal text-gray-400">Min</span></div>
          <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden mb-3">
            <div id="trainBar" class="bg-orange-500 h-full w-0 transition-all duration-300"></div>
          </div>
          <div class="flex gap-2">
            <button onclick="updateMetric('trainVal', 15, 60, 'trainBar')" class="bg-orange-500/20 text-orange-400 px-3 py-1.5 rounded-full text-xs font-semibold">+ 15 Min</button>
            <button onclick="updateMetric('trainVal', -15, 60, 'trainBar')" class="bg-gray-800 text-gray-400 px-3 py-1.5 rounded-full text-xs font-semibold">- 15</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= PAGE 3: LERNEN DETAIL ================= -->
  <div id="page-learning" class="page">
    <div class="p-5 pt-6 max-w-lg mx-auto">
      <button onclick="openPage('page-categories')" class="text-blue-500 font-semibold text-lg flex items-center gap-1 mb-4">
        ‹ Zurück
      </button>
      <h1 class="text-3xl font-bold tracking-tight mb-6">Lernen & Skills</h1>

      <div class="space-y-4">
        <div class="ios-card p-4">
          <div class="text-blue-400 font-semibold text-xs mb-1">PROGRAMMIEREN</div>
          <div class="text-2xl font-bold mb-2"><span id="codeVal">0</span> <span class="text-base font-normal text-gray-400">Sessions</span></div>
          <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden mb-3">
            <div id="codeBar" class="bg-blue-500 h-full w-0 transition-all duration-300"></div>
          </div>
          <div class="flex gap-2">
            <button onclick="updateMetric('codeVal', 1, 5, 'codeBar')" class="bg-blue-500/20 text-blue-400 px-3 py-1.5 rounded-full text-xs font-semibold">+ 1 Session</button>
            <button onclick="updateMetric('codeVal', -1, 5, 'codeBar')" class="bg-gray-800 text-gray-400 px-3 py-1.5 rounded-full text-xs font-semibold">- 1</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= PAGE 4: FINANZEN DETAIL ================= -->
  <div id="page-finance" class="page">
    <div class="p-5 pt-6 max-w-lg mx-auto">
      <button onclick="openPage('page-categories')" class="text-emerald-500 font-semibold text-lg flex items-center gap-1 mb-4">
        ‹ Zurück
      </button>
      <h1 class="text-3xl font-bold tracking-tight mb-6">Finanzen & Deals</h1>

      <div class="space-y-4">
        <div class="ios-card p-4">
          <div class="text-emerald-400 font-semibold text-xs mb-1">TRADING CARD & DEALS PROFIT</div>
          <div class="text-2xl font-bold mb-2">€<span id="flipVal">0</span></div>
          <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden mb-3">
            <div id="flipBar" class="bg-emerald-500 h-full w-0 transition-all duration-300"></div>
          </div>
          <div class="flex gap-2">
            <button onclick="updateMetric('flipVal', 20, 500, 'flipBar')" class="bg-emerald-500/20 text-emerald-400 px-3 py-1.5 rounded-full text-xs font-semibold">+ €20 Profit</button>
            <button onclick="updateMetric('flipVal', -20, 500, 'flipBar')" class="bg-gray-800 text-gray-400 px-3 py-1.5 rounded-full text-xs font-semibold">- €20</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= PAGE 5: GESUNDHEIT DETAIL ================= -->
  <div id="page-health" class="page">
    <div class="p-5 pt-6 max-w-lg mx-auto">
      <button onclick="openPage('page-categories')" class="text-pink-500 font-semibold text-lg flex items-center gap-1 mb-4">
        ‹ Zurück
      </button>
      <h1 class="text-3xl font-bold tracking-tight mb-6">Gesundheit</h1>

      <div class="space-y-4">
        <div class="ios-card p-4">
          <div class="text-pink-400 font-semibold text-xs mb-1">WASSER INTAKE</div>
          <div class="text-2xl font-bold mb-2"><span id="waterVal">0</span> <span class="text-base font-normal text-gray-400">Liter</span></div>
          <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden mb-3">
            <div id="waterBar" class="bg-pink-500 h-full w-0 transition-all duration-300"></div>
          </div>
          <div class="flex gap-2">
            <button onclick="updateMetric('waterVal', 0.5, 3, 'waterBar')" class="bg-pink-500/20 text-pink-400 px-3 py-1.5 rounded-full text-xs font-semibold">+ 0.5L</button>
            <button onclick="updateMetric('waterVal', -0.5, 3, 'waterBar')" class="bg-gray-800 text-gray-400 px-3 py-1.5 rounded-full text-xs font-semibold">- 0.5L</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- iOS Navigation Bar -->
  <div class="fixed bottom-0 left-0 right-0 ios-blur border-t border-gray-800/80 p-3">
    <div class="max-w-md mx-auto flex justify-around items-center text-xs">
      <button onclick="openPage('page-categories')" class="flex flex-col items-center gap-1 text-blue-500 font-medium">
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        Health Hub
      </button>
      <a href="https://buy.stripe.com/9B6aEW4Rh7KY6yo7BI6kg00" target="_blank" class="flex flex-col items-center gap-1 text-amber-400 font-medium">
        <span class="text-lg">⚡</span>
        Pro Upgrade
      </a>
    </div>
  </div>

  <script>
    const metricsConfig = {
      calVal: { max: 500, bar: 'calBar' },
      trainVal: { max: 60, bar: 'trainBar' },
      codeVal: { max: 5, bar: 'codeBar' },
      flipVal: { max: 500, bar: 'flipBar' },
      waterVal: { max: 3, bar: 'waterBar' }
    };

    function loadSavedData() {
      Object.keys(metricsConfig).forEach(id => {
        const saved = localStorage.getItem(`ios_hub_${id}`);
        const val = saved !== null ? parseFloat(saved) : 0;
        const el = document.getElementById(id);
        if (el) {
          el.textContent = val;
          const pct = Math.min(100, Math.max(0, (val / metricsConfig[id].max) * 100));
          document.getElementById(metricsConfig[id].bar).style.width = `${pct}%`;
        }
      });
    }

    function updateMetric(id, change, max, barId) {
      const el = document.getElementById(id);
      let val = parseFloat(el.textContent) || 0;
      val = Math.max(0, val + change);
      if (id === 'waterVal') val = Math.round(val * 10) / 10;
      
      el.textContent = val;
      localStorage.setItem(`ios_hub_${id}`, val);

      const pct = Math.min(100, (val / max) * 100);
      document.getElementById(barId).style.width = `${pct}%`;
    }

    function openPage(pageId) {
      document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
      document.getElementById(pageId).classList.add('active');
      window.scrollTo(0, 0);
    }

    function filterCategories() {
      const input = document.getElementById('searchInput').value.toLowerCase();
      const items = document.querySelectorAll('.cat-item');
      items.forEach(item => {
        const text = item.querySelector('.cat-name').textContent.toLowerCase();
        item.style.display = text.includes(input) ? 'flex' : 'none';
      });
    }

    loadSavedData();
  </script>
</body>
</html>
