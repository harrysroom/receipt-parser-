<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlipProfit - Profit & Margin Calculator</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen p-4 sm:p-8">
  <div class="max-w-xl mx-auto bg-gray-800 p-6 sm:p-8 rounded-2xl shadow-2xl border border-gray-700">
    
    <!-- Header -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
      <div>
        <h1 class="text-2xl font-bold text-white flex items-center gap-2">
          ⚡ FlipProfit
        </h1>
        <p class="text-xs text-gray-400">Trading Card & Crypto Margin Calculator</p>
      </div>
      <a href="https://buy.stripe.com/9B6aEW4Rh7KY6yo7BI6kg00" target="_blank" class="text-xs bg-amber-500 hover:bg-amber-600 text-gray-900 font-bold py-2 px-4 rounded-full shadow transition transform hover:scale-105">
        ⚡ Upgrade to Pro ($5/mo)
      </a>
    </div>

    <!-- Form Inputs -->
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Einkaufspreis (€)</label>
        <input type="number" id="buyPrice" placeholder="0.00" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 transition">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Ziel-Verkaufspreis (€)</label>
        <input type="number" id="sellPrice" placeholder="0.00" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 transition">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Plattformgebühr (%)</label>
          <input type="number" id="feePercent" value="10" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 transition">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Versandkosten (€)</label>
          <input type="number" id="shipping" placeholder="0.00" class="w-full bg-gray-900 border border-gray-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 transition">
        </div>
      </div>
    </div>

    <!-- Calculation Results -->
    <div class="mt-8 pt-6 border-t border-gray-700 space-y-3">
      <div class="flex justify-between items-center text-sm">
        <span class="text-gray-400">Gebühren Abzug:</span>
        <span id="resFees" class="font-mono text-gray-200">€0.00</span>
      </div>
      <div class="flex justify-between items-center text-sm">
        <span class="text-gray-400">Break-Even Preis (Kein Verlust):</span>
        <span id="resBreakEven" class="font-mono text-gray-200">€0.00</span>
      </div>
      <div class="flex justify-between items-center text-sm">
        <span class="text-gray-400">Gewinnspanne (ROI):</span>
        <span id="resROI" class="font-mono font-bold text-gray-200">0.00%</span>
      </div>
      
      <div class="flex justify-between items-center text-lg font-bold pt-3 border-t border-gray-700/50">
        <span>Reingewinn:</span>
        <span id="resProfit" class="font-mono text-emerald-400">€0.00</span>
      </div>
    </div>

    <!-- Pro Export Option -->
    <button id="exportBtn" class="w-full mt-6 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg shadow-lg transition flex items-center justify-center gap-2">
      <span>📥 Flip als CSV Exportieren</span>
      <span class="text-xs bg-indigo-800 px-2 py-0.5 rounded text-indigo-200">PRO</span>
    </button>
  </div>

  <script>
    const buyPriceInput = document.getElementById('buyPrice');
    const sellPriceInput = document.getElementById('sellPrice');
    const feePercentInput = document.getElementById('feePercent');
    const shippingInput = document.getElementById('shipping');

    function calculateMargin() {
      const buy = parseFloat(buyPriceInput.value) || 0;
      const sell = parseFloat(sellPriceInput.value) || 0;
      const feePercent = parseFloat(feePercentInput.value) || 0;
      const shipping = parseFloat(shippingInput.value) || 0;

      const feeAmount = sell * (feePercent / 100);
      const totalCost = buy + feeAmount + shipping;
      const netProfit = sell - totalCost;
      
      const roi = buy > 0 ? (netProfit / buy) * 100 : 0;
      const breakEven = (buy + shipping) / (1 - (feePercent / 100));

      document.getElementById('resFees').textContent = `€${feeAmount.toFixed(2)}`;
      document.getElementById('resBreakEven').textContent = `€${isFinite(breakEven) && breakEven > 0 ? breakEven.toFixed(2) : '0.00'}`;
      
      const roiDisplay = document.getElementById('resROI');
      roiDisplay.textContent = `${roi.toFixed(2)}%`;
      roiDisplay.className = `font-mono font-bold ${roi >= 0 ? 'text-emerald-400' : 'text-red-400'}`;

      const profitDisplay = document.getElementById('resProfit');
      profitDisplay.textContent = `€${netProfit.toFixed(2)}`;
      profitDisplay.className = `font-mono text-xl ${netProfit >= 0 ? 'text-emerald-400' : 'text-red-400'}`;
    }

    [buyPriceInput, sellPriceInput, feePercentInput, shippingInput].forEach(input => {
      input.addEventListener('input', calculateMargin);
    });

    document.getElementById('exportBtn').addEventListener('click', () => {
      alert("Der CSV-Export ist ein Pro-Feature! Bitte führe ein Upgrade durch, um Portfolios zu speichern.");
    });
  </script>
</body>
</html>
