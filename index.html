<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Hub - iOS Style</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .ios-card { background-color: #1c1c1e; border-radius: 16px; }
    .ios-blur { backdrop-filter: blur(20px); background: rgba(28, 28, 30, 0.85); }
    .page { display: none; }
    .page.active { display: block; }
  </style>
</head>
<body class="bg-black text-white min-h-screen pb-24 select-none">

  <!-- ================= PAGE 1: KATEGORIEN / SUCHEN ================= -->
  <div id="page-categories" class="page active">
    <div class="p-5 pt-8 max-w-lg mx-auto">
      <h1 class="text-3xl font-bold tracking-tight mb-4">Suchen</h1>
      
      <!-- Suchleiste Fake -->
      <div class="bg-[#1c1c1e] text-gray-400 rounded-xl px-3 py-2 text-sm flex items-center gap-2 mb-6">
        <span>🔍</span> Kategorien durchsuchen
      </div>

      <!-- Kategorien Liste (Apple Health Style) -->
      <div class="ios-card divide-y divide-gray-800/80 overflow-hidden">
        
        <!-- Aktivität -->
        <button onclick="openPage('page-activity')" class="w-full p-4 flex items-center justify-between hover:bg-gray-800/50 transition">
          <div class="flex items-center gap-3">
            <span class="text-xl">🔥</span>
            <span class="font-semibold text-base">Aktivität & Sport</span>
          </div>
          <span class="text-gray-500 font-bold">›</span>
        </button>

        <!-- Lernen & Bildung -->
        <button onclick="openPage('page-learning')" class="w-full p-4 flex items-center justify-between hover:bg-gray-800/50 transition">
          <div class="flex items-center gap-3">
            <span class="text-xl">📚</span>
            <span class="font-semibold text-base">Lernen & Skills</span>
          </div>
          <span class="text-gray-500 font-bold">›</span>
        </button>

        <!-- Finanzen & Flips -->
        <button onclick="openPage('page-finance')" class="w-full p-4 flex items-center justify-between hover:bg-gray-800/50 transition">
          <div class="flex items-center gap-3">
            <span class="text-xl">💼</span>
            <span class="font-semibold text-base">Finanzen & Deals</span>
          </div>
          <span class="text-gray-500 font-bold">›</span>
        </button>

        <!-- Gesundheit & Schlaf -->
        <button onclick="openPage('page-health')" class="w-full p-4 flex items-center justify-between hover:bg-gray-800/50 transition">
          <div class="flex items-center gap-3">
            <span class="text-xl">❤️</span>
            <span class="font-semibold text-base">Gesundheit & Schlaf</span>
          </div>
          <span class="text-gray-500 font-bold">›</span>
        </button>

      </div>
    </div>
  </div>

  <!-- ================= PAGE 2: AKTIVITÄT DETAIL ================= -->
  <div id="page-activity" class="page">
    <div class="p-5 pt-6 max-w-lg mx-auto">
      <button onclick="openPage('page-categories')" class="text-orange-500 font-semibold text-lg flex items-center gap-1 mb-4">
        ‹ Zurück
      </button>
      <h1 class="text-3xl font-bold tracking-tight mb-6">Aktivität</h1>

      <div class="space-y-4">
        <div class="ios-card p-4">
          <div class="text-orange-500 font-semibold text-xs mb-1">BEWEGUNG</div>
          <div class="text-2xl font-bold" id="calVal">320 kcal</div>
          <button onclick="addVal('calVal', 50, 'kcal')" class="mt-3 bg-orange-500/20 text-orange-400 px-3 py-1.5 rounded-full text-xs font-semibold">
            + 50 kcal eintragen
          </button>
        </div>

        <div class="ios-card p-4">
          <div class="text-orange-500 font-semibold text-xs mb-1">TRAINING</div>
          <div class="text-2xl font-bold" id="trainVal">45 Min</div>
          <button onclick="addVal('trainVal', 15, 'Min')" class="mt-3 bg-orange-500/20 text-orange-400 px-3 py-1.5 rounded-full text-xs font-semibold">
            + 15 Min eintragen
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= PAGE 3: LERNEN DETAIL ================= -->
  <div id="page-learning" class="page">
    <div class="p-5 pt-6 max-w-lg mx-auto">
      <button onclick="openPage('page-categories')" class="text-blue-500 font-semibold text-lg flex items-center gap-1 mb-4">
        ‹ Zurück
      </button>
      <h1 class="text-3xl font-bold tracking-tight mb-6">Lernen & Skills</h1>

      <div class="space-y-4">
        <div class="ios-card p-4">
          <div class="text-blue-400 font-semibold text-xs mb-1">PROGRAMMIEREN</div>
          <div class="text-2xl font-bold" id="codeVal">2 Sessions</div>
          <button onclick="addVal('codeVal', 1, 'Sessions')" class="mt-3 bg-blue-500/20 text-blue-400 px-3 py-1.5 rounded-full text-xs font-semibold">
            + 1 Session abschließen
          </button>
        </div>

        <div class="ios-card p-4">
          <div class="text-blue-400 font-semibold text-xs mb-1">SPRACHEN / LESEN</div>
          <div class="text-2xl font-bold" id="readVal">20 Seiten</div>
          <button onclick="addVal('readVal', 5, 'Seiten')" class="mt-3 bg-blue-500/20 text-blue-400 px-3 py-1.5 rounded-full text-xs font-semibold">
            + 5 Seiten
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= PAGE 4: FINANZEN DETAIL ================= -->
  <div id="page-finance" class="page">
    <div class="p-5 pt-6 max-w-lg mx-auto">
      <button onclick="openPage('page-categories')" class="text-emerald-500 font-semibold text-lg flex items-center gap-1 mb-4">
        ‹ Zurück
      </button>
      <h1 class="text-3xl font-bold tracking-tight mb-6">Finanzen & Deals</h1>

      <div class="space-y-4">
        <div class="ios-card p-4">
          <div class="text-emerald-400 font-semibold text-xs mb-1">TRADING CARD FLIPS</div>
          <div class="text-2xl font-bold" id="flipVal">€120 Profit</div>
          <button onclick="addVal('flipVal', 20, 'Profit', '€')" class="mt-3 bg-emerald-500/20 text-emerald-400 px-3 py-1.5 rounded-full text-xs font-semibold">
            + €20 Profit buchen
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= PAGE 5: GESUNDHEIT DETAIL ================= -->
  <div id="page-health" class="page">
    <div class="p-5 pt-6 max-w-lg mx-auto">
      <button onclick="openPage('page-categories')" class="text-pink-500 font-semibold text-lg flex items-center gap-1 mb-4">
        ‹ Zurück
      </button>
      <h1 class="text-3xl font-bold tracking-tight mb-6">Gesundheit</h1>

      <div class="space-y-4">
        <div class="ios-card p-4">
          <div class="text-pink-400 font-semibold text-xs mb-1">WASSER INTAKE</div>
          <div class="text-2xl font-bold" id="waterVal">1.5 Litern</div>
          <button onclick="addVal('waterVal', 0.5, 'Litern')" class="mt-3 bg-pink-500/20 text-pink-400 px-3 py-1.5 rounded-full text-xs font-semibold">
            + 0.5L trinken
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- iOS Navigation Bar -->
  <div class="fixed bottom-0 left-0 right-0 ios-blur border-t border-gray-800/80 p-3">
    <div class="max-w-md mx-auto flex justify-around items-center text-xs">
      <button onclick="openPage('page-categories')" class="flex flex-col items-center gap-1 text-blue-500 font-medium">
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        Health Hub
      </button>
      <a href="https://buy.stripe.com/9B6aEW4Rh7KY6yo7BI6kg00" target="_blank" class="flex flex-col items-center gap-1 text-amber-400 font-medium">
        <span class="text-lg">⚡</span>
        Pro Upgrade
      </a>
    </div>
  </div>

  <script>
    function openPage(pageId) {
      document.querySelectorAll('.page').forEach(page => {
        page.classList.remove('active');
      });
      document.getElementById(pageId).classList.add('active');
      window.scrollTo(0, 0);
    }

    function addVal(id, amount, unit, prefix = '') {
      const el = document.getElementById(id);
      let current = parseFloat(el.textContent.replace(/[^0-9.]/g, '')) || 0;
      let total = (current + amount);
      if (unit === 'Litern') total = total.toFixed(1);
      el.textContent = `${prefix}${total} ${unit}`;
    }
  </script>
</body>
</html>
