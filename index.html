<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receipt to CSV Converter</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen p-6">
  <div class="max-w-xl mx-auto bg-white p-8 rounded-xl shadow-md border border-gray-200">
    <h1 class="text-2xl font-bold mb-2 text-center text-gray-900">Receipt to CSV Converter</h1>
    <p class="text-sm text-gray-500 text-center mb-6">Convert receipt images into structured CSV data instantly.</p>

    <!-- API Key Input -->
    <div class="mb-5">
      <label class="block text-xs font-semibold text-gray-700 uppercase tracking-wider mb-2">OpenAI API Key</label>
      <input type="password" id="apiKeyInput" placeholder="sk-proj-..." class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      <p class="text-xs text-gray-400 mt-1">Your key runs directly in your browser and is never saved on a server.</p>
    </div>

    <!-- File Dropzone -->
    <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center bg-gray-50 hover:bg-gray-100 transition cursor-pointer" id="dropzone">
      <input type="file" id="fileInput" accept="image/*" class="hidden">
      <p class="text-gray-600 font-medium">Click or drag & drop receipt image here</p>
      <span id="fileName" class="text-xs text-indigo-600 font-semibold block mt-2"></span>
    </div>

    <!-- Process Button -->
    <button id="processBtn" class="w-full mt-5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition disabled:opacity-50">
      Parse Receipt
    </button>

    <!-- Results Display -->
    <div id="resultArea" class="mt-6 hidden">
      <h2 class="text-md font-semibold mb-2">Extracted Data:</h2>
      <div class="bg-gray-50 border border-gray-200 p-4 rounded-lg text-sm font-mono space-y-1">
        <p><strong>Vendor:</strong> <span id="resVendor"></span></p>
        <p><strong>Date:</strong> <span id="resDate"></span></p>
        <p><strong>Tax:</strong> $<span id="resTax"></span></p>
        <p><strong>Total:</strong> $<span id="resTotal"></span></p>
      </div>

      <button id="downloadBtn" class="w-full mt-3 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 rounded-lg transition">
        Download CSV
      </button>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const dropzone = document.getElementById('dropzone');
    const fileNameDisplay = document.getElementById('fileName');
    const processBtn = document.getElementById('processBtn');
    const resultArea = document.getElementById('resultArea');
    const apiKeyInput = document.getElementById('apiKeyInput');

    let parsedResult = null;

    dropzone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) {
        fileNameDisplay.textContent = fileInput.files[0].name;
      }
    });

    const toBase64 = file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = error => reject(error);
    });

    processBtn.addEventListener('click', async () => {
      const apiKey = apiKeyInput.value.trim();
      const file = fileInput.files[0];

      if (!apiKey) return alert("Please enter your OpenAI API key.");
      if (!file) return alert("Please select a receipt image.");

      processBtn.disabled = true;
      processBtn.textContent = "Processing with AI...";

      try {
        const base64 = await toBase64(file);

        // Direct Browser Call to OpenAI
        const response = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${apiKey}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "gpt-4o-mini",
            messages: [
              {
                role: "user",
                content: [
                  { type: "text", text: "Extract receipt details: vendor_name, transaction_date, tax_amount, total_amount." },
                  { type: "image_url", image_url: { url: `data:${file.type};base64,${base64}` } }
                ]
              }
            ],
            response_format: {
              type: "json_schema",
              json_schema: {
                name: "receipt_data",
                schema: {
                  type: "object",
                  properties: {
                    vendor_name: { type: "string" },
                    transaction_date: { type: "string" },
                    tax_amount: { type: "number" },
                    total_amount: { type: "number" }
                  },
                  required: ["vendor_name", "total_amount", "transaction_date"]
                }
              }
            }
          })
        });

        const data = await response.json();
        
        if (data.error) throw new Error(data.error.message);

        parsedResult = JSON.parse(data.choices[0].message.content);

        document.getElementById('resVendor').textContent = parsedResult.vendor_name || 'N/A';
        document.getElementById('resDate').textContent = parsedResult.transaction_date || 'N/A';
        document.getElementById('resTax').textContent = parsedResult.tax_amount || '0.00';
        document.getElementById('resTotal').textContent = parsedResult.total_amount || '0.00';

        resultArea.classList.remove('hidden');
      } catch (err) {
        alert("Error: " + err.message);
      } finally {
        processBtn.disabled = false;
        processBtn.textContent = "Parse Receipt";
      }
    });

    document.getElementById('downloadBtn').addEventListener('click', () => {
      if (!parsedResult) return;
      const csvContent = "data:text/csv;charset=utf-8," 
        + "Vendor,Date,Tax,Total\n"
        + `"${parsedResult.vendor_name}","${parsedResult.transaction_date}",${parsedResult.tax_amount},${parsedResult.total_amount}`;
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `receipt_${Date.now()}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });
  </script>
</body>
</html>
