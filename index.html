<!DOCTYPE html>
<html lang="de" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahmad Store - Premium Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #09090b;
      color: #f4f4f5;
    }
    h1, h2, h3, .font-heading { font-family: 'Outfit', sans-serif; }

    .glass {
      background: rgba(24, 24, 27, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-gold {
      background: rgba(30, 24, 16, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .card-glow {
      box-shadow: 0 10px 30px -10px rgba(245, 158, 11, 0.15);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card-glow:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px -15px rgba(245, 158, 11, 0.3);
      border-color: rgba(245, 158, 11, 0.5);
    }
    .page { display: none; }
    .page.active { display: block; }
  </style>
</head>
<body class="min-h-screen pb-32 antialiased selection:bg-amber-500 selection:text-black">

  <!-- TOP NAVIGATION -->
  <header class="sticky top-0 z-40 glass border-b border-white/10 px-5 py-4">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2 cursor-pointer" onclick="switchTab('store')">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-amber-500 to-yellow-300 flex items-center justify-center font-black text-black text-xs">SHOP</div>
        <span class="font-heading font-extrabold text-lg tracking-tight text-white">AHMAD STORE</span>
      </div>
      
      <div class="flex items-center gap-3">
        <button onclick="toggleCart()" class="relative p-2.5 rounded-full glass hover:bg-white/10 transition">
          <svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
          <span id="cart-badge" class="absolute -top-1 -right-1 bg-amber-500 text-black font-extrabold text-[10px] w-4 h-4 rounded-full flex items-center justify-center hidden">0</span>
        </button>
        <button onclick="requestAdminAccess()" class="p-2.5 rounded-full glass hover:bg-white/10 transition text-xs">
          ⚙️
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="max-w-4xl mx-auto px-4 pt-6">

    <!-- ADMIN PANEL (GESCHÜTZT DURCH PIN 0313) -->
    <div id="admin-panel" class="hidden mb-8 p-5 glass-gold rounded-3xl space-y-4">
      <div class="flex justify-between items-center border-b border-amber-500/20 pb-3">
        <h3 class="font-heading font-bold text-sm text-amber-300">Admin Dashboard: Produkt hochladen</h3>
        <button onclick="toggleAdminPanel()" class="text-xs text-gray-400 hover:text-white">✕ Schließen</button>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <input type="text" id="new-prod-name" placeholder="Produktname" class="bg-black/50 border border-white/10 rounded-xl p-2.5 text-xs text-white">
        <input type="text" id="new-prod-price" placeholder="Preis (z.B. 29,99 €)" class="bg-black/50 border border-white/10 rounded-xl p-2.5 text-xs text-white">
        <input type="text" id="new-prod-badge" placeholder="Badge/Kategorie (z.B. Neu / Rarität)" class="bg-black/50 border border-white/10 rounded-xl p-2.5 text-xs text-white">
        <input type="text" id="new-prod-stripe" placeholder="Stripe Bezahl-Link (https://buy.stripe.com/...)" class="bg-black/50 border border-white/10 rounded-xl p-2.5 text-xs text-white">
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1">Produktbild auswählen:</label>
        <input type="file" id="new-prod-file" accept="image/*" class="text-xs text-gray-300 w-full file:mr-3 file:py-1.5 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-amber-400 file:text-black">
      </div>
      <button onclick="addNewProduct()" class="w-full bg-amber-400 hover:bg-amber-300 text-black font-extrabold py-2.5 rounded-xl text-xs transition">Echtes Produkt im Shop veröffentlichen</button>
    </div>

    <!-- TAB 1: STORE -->
    <div id="tab-store" class="page active space-y-8">
      <div>
        <div class="flex justify-between items-center mb-5">
          <h2 class="text-xl font-heading font-bold text-white">Produkte</h2>
          <span class="text-xs text-gray-400">Live-Katalog</span>
        </div>

        <div id="product-grid" class="grid grid-cols-2 md:grid-cols-3 gap-4">
          <!-- Dynamische Produkte werden hier geladen -->
        </div>
      </div>
    </div>
  </main>

  <!-- WARENKORB SIDEBAR MIT ZAHLUNGSLOGOS -->
  <div id="cart-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex justify-end">
    <div class="w-full max-w-md bg-[#121215] h-full p-6 flex flex-col justify-between border-l border-white/10 shadow-2xl overflow-y-auto">
      <div class="space-y-4">
        <div class="flex justify-between items-center border-b border-white/10 pb-4">
          <h3 class="font-heading font-bold text-base text-white">Dein Warenkorb</h3>
          <button onclick="toggleCart()" class="w-8 h-8 rounded-full glass flex items-center justify-center text-xs">✕</button>
        </div>

        <div id="cart-items-container" class="space-y-3">
          <!-- Warenkorb Artikel -->
        </div>
      </div>

      <div class="border-t border-white/10 pt-4 space-y-4">
        <div class="flex justify-between items-center text-sm">
          <span class="text-gray-400">Gesamtsumme:</span>
          <span id="cart-total-price" class="font-black text-amber-400 text-lg">0,00 €</span>
        </div>

        <!-- ECHTE ZAHLUNGSMETHODEN LOGOS & BUTTON -->
        <div class="space-y-3">
          <a id="checkout-btn" href="#" target="_blank" class="w-full bg-gradient-to-r from-amber-400 to-amber-500 text-black font-extrabold py-3.5 rounded-2xl block text-center text-xs shadow-lg shadow-amber-500/20 hover:opacity-95 transition">
            Sicher zur Kasse (Stripe)
          </a>

          <!-- Zahlungslogos (Apple Pay, Visa, Mastercard, PayPal) -->
          <div class="pt-2 border-t border-white/5 flex flex-col items-center gap-2">
            <span class="text-[10px] text-gray-500 tracking-wider uppercase font-semibold">Akzeptierte Zahlungsmethoden</span>
            <div class="flex items-center gap-2.5 opacity-80">
              <!-- Apple Pay Logo -->
              <div class="bg-white text-black px-2 py-1 rounded text-[10px] font-black tracking-tighter flex items-center gap-0.5">
                 Pay
              </div>
              <!-- Visa Logo -->
              <div class="bg-blue-900 text-white px-2 py-1 rounded text-[10px] font-black italic tracking-wider">
                VISA
              </div>
              <!-- Mastercard Logo -->
              <div class="bg-zinc-800 border border-zinc-700 text-white px-2 py-1 rounded text-[10px] font-bold flex items-center">
                <span class="w-2.5 h-2.5 rounded-full bg-red-500 inline-block"></span>
                <span class="w-2.5 h-2.5 rounded-full bg-amber-500 inline-block -ml-1"></span>
              </div>
              <!-- PayPal Logo -->
              <div class="bg-sky-600 text-white px-2 py-1 rounded text-[10px] font-extrabold italic">
                PayPal
              </div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- NAVIGATION -->
  <nav class="fixed bottom-0 left-0 right-0 glass border-t border-white/10 z-30 py-3 px-6">
    <div class="max-w-xs mx-auto flex justify-around items-center text-[11px] text-gray-400 font-semibold">
      <button onclick="switchTab('store')" class="flex flex-col items-center gap-1 text-amber-400">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3z"/></svg>
        Shop
      </button>
      <button onclick="toggleCart()" class="flex flex-col items-center gap-1 hover:text-white transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
        Warenkorb
      </button>
    </div>
  </nav>

  <script>
    const ADMIN_PIN = "0313";
    let products = JSON.parse(localStorage.getItem('custom_store_products')) || [];
    let cart = JSON.parse(localStorage.getItem('custom_store_cart')) || [];

    function init() {
      renderProducts();
      updateCartBadge();
    }

    function renderProducts() {
      const grid = document.getElementById('product-grid');
      grid.innerHTML = '';

      if (products.length === 0) {
        grid.innerHTML = `<div class="col-span-2 md:col-span-3 text-center py-12"><p class="text-xs text-gray-500 italic">Noch keine Produkte vorhanden. Klicke oben auf ⚙️ (PIN: 0313) um dein erstes Produkt hochzuladen!</p></div>`;
        return;
      }

      products.forEach(prod => {
        const div = document.createElement('div');
        div.className = "glass p-3.5 rounded-2xl card-glow flex flex-col justify-between";
        div.innerHTML = `
          <div>
            <div class="w-full h-44 rounded-xl overflow-hidden mb-3 bg-black/40 relative">
              <img src="${prod.img}" class="w-full h-full object-cover" alt="${prod.name}">
              <span class="absolute top-2 left-2 text-[9px] bg-black/70 backdrop-blur-md text-amber-400 font-bold px-2 py-0.5 rounded-full border border-amber-500/20">${prod.badge}</span>
            </div>
            <h3 class="font-heading font-bold text-sm text-white truncate">${prod.name}</h3>
            <p class="text-xs font-black text-amber-400 mt-1">${prod.price.toFixed(2).replace('.', ',')} €</p>
          </div>
          <div class="mt-4 flex gap-2">
            <button onclick="addToCart('${prod.id}')" class="flex-1 bg-white/10 hover:bg-amber-400 hover:text-black text-white font-extrabold py-2 rounded-xl text-xs transition">
              In den Warenkorb
            </button>
          </div>
        `;
        grid.appendChild(div);
      });
    }

    function requestAdminAccess() {
      const pin = prompt("Admin PIN eingeben (Standard: 0313):");
      if (pin === ADMIN_PIN) {
        toggleAdminPanel();
      } else if (pin !== null) {
        alert("Falsche PIN!");
      }
    }

    function toggleAdminPanel() {
      document.getElementById('admin-panel').classList.toggle('hidden');
    }

    function addNewProduct() {
      const name = document.getElementById('new-prod-name').value;
      const priceVal = parseFloat(document.getElementById('new-prod-price').value.replace(',', '.'));
      const badge = document.getElementById('new-prod-badge').value || "Produkt";
      const stripeLink = document.getElementById('new-prod-stripe').value || "https://buy.stripe.com/9B6aEW4Rh7KY6yo7BI6kg00";
      const fileInput = document.getElementById('new-prod-file');

      if (!name || isNaN(priceVal)) {
        alert("Bitte Namen und gültigen Preis eingeben.");
        return;
      }

      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          saveNewProductData(name, priceVal, badge, stripeLink, e.target.result);
        };
        reader.readAsDataURL(fileInput.files[0]);
      } else {
        saveNewProductData(name, priceVal, badge, stripeLink, "https://images.unsplash.com/photo-1613771404784-3a5686aa2be3?w=500&auto=format&fit=crop&q=80");
      }
    }

    function saveNewProductData(name, price, badge, stripeLink, imgUrl) {
      const newProd = {
        id: "prod-" + Date.now(),
        name,
        price,
        badge,
        stripeLink,
        img: imgUrl
      };

      products.push(newProd);
      localStorage.setItem('custom_store_products', JSON.stringify(products));
      renderProducts();
      toggleAdminPanel();
      alert("Produkt erfolgreich hochgeladen!");
    }

    function addToCart(id) {
      const item = products.find(p => p.id === id);
      if (item) {
        cart.push(item);
        saveCart();
        updateCartBadge();
        toggleCart();
      }
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      saveCart();
      renderCartItems();
      updateCartBadge();
    }

    function saveCart() {
      localStorage.setItem('custom_store_cart', JSON.stringify(cart));
    }

    function updateCartBadge() {
      const badge = document.getElementById('cart-badge');
      if (cart.length > 0) {
        badge.textContent = cart.length;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function toggleCart() {
      document.getElementById('cart-modal').classList.toggle('hidden');
      renderCartItems();
    }

    function renderCartItems() {
      const container = document.getElementById('cart-items-container');
      const totalEl = document.getElementById('cart-total-price');
      const checkoutBtn = document.getElementById('checkout-btn');
      container.innerHTML = '';

      if (cart.length === 0) {
        container.innerHTML = `<p class="text-xs text-gray-500 italic text-center py-6">Dein Warenkorb ist leer.</p>`;
        totalEl.textContent = '0,00 €';
        checkoutBtn.href = "#";
        return;
      }

      let total = 0;
      let activeStripeLink = "https://buy.stripe.com/9B6aEW4Rh7KY6yo7BI6kg00";

      cart.forEach((item, index) => {
        total += item.price;
        if (index === 0 && item.stripeLink) activeStripeLink = item.stripeLink;

        const div = document.createElement('div');
        div.className = "flex justify-between items-center glass p-3 rounded-xl";
        div.innerHTML = `
          <div class="flex items-center gap-3">
            <img src="${item.img}" class="w-10 h-12 rounded object-cover">
            <div>
              <p class="text-xs font-bold text-white">${item.name}</p>
              <p class="text-[11px] text-amber-400 font-semibold">${item.price.toFixed(2).replace('.', ',')} €</p>
            </div>
          </div>
          <button onclick="removeFromCart(${index})" class="text-xs text-red-400 hover:text-red-300 p-1">Entfernen</button>
        `;
        container.appendChild(div);
      });

      totalEl.textContent = total.toFixed(2).replace('.', ',') + ' €';
      checkoutBtn.href = activeStripeLink;
    }

    function switchTab(tabId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('tab-' + tabId).classList.add('active');
      window.scrollTo(0, 0);
    }

    window.onload = init;
  </script>
</body>
</html>
