<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DailyStreak - Modern Habit Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 text-slate-100 min-h-screen p-4 sm:p-8 flex flex-col justify-between">
  
  <div class="max-w-xl mx-auto w-full glass p-6 sm:p-8 rounded-3xl border border-slate-700/60 shadow-2xl">
    
    <!-- Header -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
      <div>
        <div class="flex items-center gap-2">
          <span class="text-2xl">🔥</span>
          <h1 class="text-2xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">DailyStreak</h1>
        </div>
        <p class="text-xs text-slate-400 mt-0.5">Build habits. Keep your streak alive.</p>
      </div>
      <a href="https://buy.stripe.com/9B6aEW4Rh7KY6yo7BI6kg00" target="_blank" class="w-full sm:w-auto text-center text-xs bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-slate-950 font-bold py-2.5 px-5 rounded-xl shadow-lg shadow-orange-500/20 transition transform active:scale-95">
        ⚡ Pro Upgrade ($5/mo)
      </a>
    </div>

    <!-- Daily Progress Bar -->
    <div class="mb-8 bg-slate-900/80 p-4 rounded-2xl border border-slate-800">
      <div class="flex justify-between text-xs font-semibold mb-2">
        <span class="text-slate-400">Tagesfortschritt</span>
        <span id="progressText" class="text-indigo-400">0%</span>
      </div>
      <div class="w-full bg-slate-800 rounded-full h-2.5 overflow-hidden">
        <div id="progressBar" class="bg-gradient-to-r from-indigo-500 to-cyan-400 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
      </div>
    </div>

    <!-- Habit Creator -->
    <div class="space-y-3 mb-6">
      <div class="flex flex-col sm:flex-row gap-2">
        <input type="text" id="habitInput" placeholder="Neue Gewohnheit..." class="flex-1 bg-slate-900/90 border border-slate-700/80 rounded-xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
        <select id="categoryInput" class="bg-slate-900/90 border border-slate-700/80 rounded-xl px-3 py-3 text-sm text-slate-300 focus:outline-none focus:border-indigo-500 transition">
          <option value="⚡ Alltag">⚡ Alltag</option>
          <option value="💪 Sport">💪 Sport</option>
          <option value="📚 Lernen">📚 Lernen</option>
          <option value="💼 Business">💼 Business</option>
          <option value="🧘 Gesundheit">🧘 Gesundheit</option>
        </select>
      </div>
      <button id="addBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white font-semibold py-3 rounded-xl shadow-lg shadow-indigo-600/30 transition">
        Habit hinzufügen
      </button>
    </div>

    <!-- Filters -->
    <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-800 text-xs">
      <span class="text-slate-400 font-medium">Meine Gewohnheiten</span>
      <div class="flex gap-1 bg-slate-900/80 p-1 rounded-lg border border-slate-800">
        <button onclick="setFilter('all')" id="filter-all" class="px-2.5 py-1 rounded-md font-medium transition text-indigo-400 bg-slate-800">Alle</button>
        <button onclick="setFilter('open')" id="filter-open" class="px-2.5 py-1 rounded-md font-medium text-slate-400 hover:text-slate-200 transition">Offen</button>
        <button onclick="setFilter('completed')" id="filter-completed" class="px-2.5 py-1 rounded-md font-medium text-slate-400 hover:text-slate-200 transition">Erledigt</button>
      </div>
    </div>

    <!-- Habit List -->
    <div id="habitList" class="space-y-3 min-h-[120px]">
      <!-- Dynamic Content -->
    </div>

    <!-- Pro Export Banner -->
    <div class="mt-8 pt-6 border-t border-slate-800 text-center">
      <button id="exportBtn" class="w-full bg-slate-900/90 hover:bg-slate-800 text-slate-300 text-xs font-semibold py-3 rounded-xl border border-slate-800 transition flex items-center justify-center gap-2">
        <span>📊 Detailierte Wochen-Analysen Exportieren</span>
        <span class="bg-amber-500/10 text-amber-400 border border-amber-500/20 px-2 py-0.5 rounded-md font-bold">PRO</span>
      </button>
    </div>

  </div>

  <footer class="text-center text-xs text-slate-500 mt-6">
    DailyStreak &copy; 2026 – Daten werden lokal auf deinem Gerät gespeichert.
  </footer>

  <script>
    let habits = JSON.parse(localStorage.getItem('daily_habits_v2')) || [
      { id: 1, name: '2 Liter Wasser trinken', category: '🧘 Gesundheit', streak: 4, completedToday: false },
      { id: 2, name: '30 Min Code / Lernen', category: '📚 Lernen', streak: 12, completedToday: true }
    ];

    let currentFilter = 'all';

    const habitInput = document.getElementById('habitInput');
    const categoryInput = document.getElementById('categoryInput');
    const addBtn = document.getElementById('addBtn');
    const habitList = document.getElementById('habitList');

    function saveAndRender() {
      localStorage.setItem('daily_habits_v2', JSON.stringify(habits));
      renderHabits();
    }

    function setFilter(filter) {
      currentFilter = filter;
      ['all', 'open', 'completed'].forEach(f => {
        const btn = document.getElementById(`filter-${f}`);
        if (f === filter) {
          btn.className = 'px-2.5 py-1 rounded-md font-medium transition text-indigo-400 bg-slate-800';
        } else {
          btn.className = 'px-2.5 py-1 rounded-md font-medium text-slate-400 hover:text-slate-200 transition';
        }
      });
      renderHabits();
    }

    function renderHabits() {
      habitList.innerHTML = '';
      
      const filtered = habits.filter(h => {
        if (currentFilter === 'open') return !h.completedToday;
        if (currentFilter === 'completed') return h.completedToday;
        return true;
      });

      // Progress bar calculation
      const completedCount = habits.filter(h => h.completedToday).length;
      const progressPercent = habits.length > 0 ? Math.round((completedCount / habits.length) * 100) : 0;
      document.getElementById('progressBar').style.width = `${progressPercent}%`;
      document.getElementById('progressText').textContent = `${progressPercent}%`;

      if (filtered.length === 0) {
        habitList.innerHTML = '<div class="text-center py-8 text-slate-500 text-xs font-medium">Keine Gewohnheiten in dieser Ansicht.</div>';
        return;
      }

      filtered.forEach(habit => {
        const item = document.createElement('div');
        item.className = `group flex items-center justify-between p-4 rounded-2xl border transition-all duration-300 ${
          habit.completedToday 
            ? 'bg-slate-900/40 border-slate-800/80 opacity-75' 
            : 'bg-slate-900/90 border-slate-800 hover:border-slate-700 shadow-md'
        }`;
        
        item.innerHTML = `
          <div class="flex items-center gap-3.5">
            <button onclick="toggleHabit(${habit.id})" class="w-6 h-6 rounded-lg border flex items-center justify-center transition ${
              habit.completedToday 
                ? 'bg-emerald-500 border-emerald-500 text-slate-950 font-bold' 
                : 'border-slate-600 hover:border-indigo-400 bg-slate-800/50'
            }">
              ${habit.completedToday ? '✓' : ''}
            </button>
            <div>
              <p class="text-sm font-medium ${habit.completedToday ? 'line-through text-slate-500' : 'text-slate-100'}">${habit.name}</p>
              <span class="inline-block text-[10px] text-slate-400 mt-0.5">${habit.category}</span>
            </div>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-xs bg-amber-500/10 border border-amber-500/20 text-amber-400 px-2.5 py-1 rounded-xl font-mono font-medium flex items-center gap-1">
              🔥 ${habit.streak}d
            </span>
            <button onclick="deleteHabit(${habit.id})" class="text-slate-600 hover:text-rose-400 text-sm transition p-1">✕</button>
          </div>
        `;
        habitList.appendChild(item);
      });
    }

    addBtn.addEventListener('click', () => {
      const val = habitInput.value.trim();
      if (!val) return;
      habits.push({
        id: Date.now(),
        name: val,
        category: categoryInput.value,
        streak: 0,
        completedToday: false
      });
      habitInput.value = '';
      saveAndRender();
    });

    window.toggleHabit = function(id) {
      habits = habits.map(h => {
        if (h.id === id) {
          const newState = !h.completedToday;
          return {
            ...h,
            completedToday: newState,
            streak: newState ? h.streak + 1 : Math.max(0, h.streak - 1)
          };
        }
        return h;
      });
      saveAndRender();
    };

    window.deleteHabit = function(id) {
      habits = habits.filter(h => h.id !== id);
      saveAndRender();
    };

    document.getElementById('exportBtn').addEventListener('click', () => {
      alert("CSV-Export & Wochen-Analysen stehen in der Pro-Version zur Verfügung!");
    });

    renderHabits();
  </script>
</body>
</html>
