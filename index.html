<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DailyStreak - Habit Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen p-4 sm:p-8">
  <div class="max-w-xl mx-auto bg-gray-800 p-6 sm:p-8 rounded-2xl shadow-2xl border border-gray-700">
    
    <!-- Header -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
      <div>
        <h1 class="text-2xl font-bold text-white flex items-center gap-2">
          🔥 DailyStreak
        </h1>
        <p class="text-xs text-gray-400">Täglicher Gewohnheits-Tracker</p>
      </div>
      <a href="https://buy.stripe.com/9B6aEW4Rh7KY6yo7BI6kg00" target="_blank" class="text-xs bg-amber-500 hover:bg-amber-600 text-gray-900 font-bold py-2 px-4 rounded-full shadow transition transform hover:scale-105">
        ⚡ Pro Version ($5/mo)
      </a>
    </div>

    <!-- Add Habit Input -->
    <div class="flex gap-2 mb-6">
      <input type="text" id="habitInput" placeholder="Neue Gewohnheit (z.B. Sport, Lesen)..." class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 transition">
      <button id="addBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-lg font-semibold transition">
        Hinzufügen
      </button>
    </div>

    <!-- Habit List -->
    <div id="habitList" class="space-y-3">
      <!-- Dynamic Habits -->
    </div>

    <!-- Pro Upgrade Banner -->
    <div class="mt-8 pt-6 border-t border-gray-700 text-center">
      <p class="text-xs text-gray-400 mb-3">Speichere unbegrenzt Habits & erhalte Wochen-Analysen.</p>
      <button id="exportBtn" class="w-full bg-gray-700 hover:bg-gray-600 text-gray-200 text-sm font-medium py-2.5 rounded-lg transition flex items-center justify-center gap-2">
        <span>📊 Wochen-Bericht Exportieren</span>
        <span class="text-xs bg-amber-500 text-gray-900 px-2 py-0.5 rounded font-bold">PRO</span>
      </button>
    </div>
  </div>

  <script>
    let habits = JSON.parse(localStorage.getItem('daily_habits')) || [
      { id: 1, name: 'Trinken (2 Liter)', streak: 3, completedToday: false },
      { id: 2, name: '30 Min Lernen / Lesen', streak: 5, completedToday: false }
    ];

    const habitInput = document.getElementById('habitInput');
    const addBtn = document.getElementById('addBtn');
    const habitList = document.getElementById('habitList');

    function saveAndRender() {
      localStorage.setItem('daily_habits', JSON.stringify(habits));
      renderHabits();
    }

    function renderHabits() {
      habitList.innerHTML = '';
      if (habits.length === 0) {
        habitList.innerHTML = '<p class="text-gray-500 text-sm text-center py-4">Noch keine Gewohnheiten angelegt.</p>';
        return;
      }

      habits.forEach(habit => {
        const item = document.createElement('div');
        item.className = `flex items-center justify-between p-4 rounded-xl border transition ${habit.completedToday ? 'bg-indigo-950/40 border-indigo-500/50' : 'bg-gray-900 border-gray-700'}`;
        
        item.innerHTML = `
          <div class="flex items-center gap-3">
            <button onclick="toggleHabit(${habit.id})" class="w-6 h-6 rounded-full border-2 flex items-center justify-center transition ${habit.completedToday ? 'bg-emerald-500 border-emerald-500 text-gray-900' : 'border-gray-500 hover:border-indigo-400'}">
              ${habit.completedToday ? '✓' : ''}
            </button>
            <span class="font-medium ${habit.completedToday ? 'line-through text-gray-400' : 'text-white'}">${habit.name}</span>
          </div>
          <div class="flex items-center gap-4">
            <span class="text-xs bg-gray-800 border border-gray-700 px-2.5 py-1 rounded-full text-amber-400 font-mono flex items-center gap-1">
              🔥 ${habit.streak} Tage
            </span>
            <button onclick="deleteHabit(${habit.id})" class="text-gray-500 hover:text-red-400 text-sm">✕</button>
          </div>
        `;
        habitList.appendChild(item);
      });
    }

    addBtn.addEventListener('click', () => {
      const val = habitInput.value.trim();
      if (!val) return;
      habits.push({ id: Date.now(), name: val, streak: 0, completedToday: false });
      habitInput.value = '';
      saveAndRender();
    });

    window.toggleHabit = function(id) {
      habits = habits.map(h => {
        if (h.id === id) {
          const newState = !h.completedToday;
          return {
            ...h,
            completedToday: newState,
            streak: newState ? h.streak + 1 : Math.max(0, h.streak - 1)
          };
        }
        return h;
      });
      saveAndRender();
    };

    window.deleteHabit = function(id) {
      habits = habits.filter(h => h.id !== id);
      saveAndRender();
    };

    document.getElementById('exportBtn').addEventListener('click', () => {
      alert("Wochen-Analysen und Export sind Pro-Funktionen! Führe oben das Upgrade durch.");
    });

    renderHabits();
  </script>
</body>
</html>
